name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - uses: pnpm/action-setup@v4
        with:
          version: ^11.28.6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint:client

      - name: Run audit
        run: pnpm audit --audit-level high

      - name: Run unit tests
        run: pnpm test:client:unit

      - name: Check if changeset is present
        if: github.actor != 'imodeljs-admin'
        run: |
          # There are issues with changesets in github workflows, so we need to force pull the master branch
          # Fix for issue https://github.com/changesets/changesets/issues/517#issuecomment-884778604
          git pull -f origin main:main
          pnpm changeset status --since=main

      - name: Refuse to merge a manually edited version into main
        if: github.actor != 'imodeljs-admin'
        run: |
          MAIN_VERSION=$(git show main:packages/scenes-client/package.json | jq -r .version)
          PR_VERSION=$(jq -r .version packages/scenes-client/package.json)
          if [ "$MAIN_VERSION" != "$PR_VERSION" ]; then
            echo "::error::packages/scenes-client/package.json version changed from '$MAIN_VERSION' to '$PR_VERSION' on this branch. The version on main should only ever be updated by the automated release workflow."
            exit 1
          fi
