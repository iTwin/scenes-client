# This workflow automatically publishes beta prereleases whenever a branch is in
# Changesets beta prerelease mode (i.e. '.changeset/pre.json' exists with mode "pre" and tag "beta").
# For the full beta-release process (how to start one, iterate, and exit before merging to main),
# see CONTRIBUTING.md's "Publishing Beta Versions" section.
name: Changesets Beta Prerelease

on:
  push:
    branches-ignore:
      - main
      - "changeset-release/**" # branches pushed by changesets/action
    tags-ignore:
      - "**"

concurrency:
  group: beta-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-prerelease-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for beta prerelease mode
        id: check
        run: |
          if [ -f .changeset/pre.json ]; then
            STATE=$(node -p "const p=require('./.changeset/pre.json'); p.mode + ':' + p.tag")
            if [ "$STATE" = "pre:beta" ]; then
              echo "active=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::.changeset/pre.json is '$STATE' (expected 'pre:beta'); skipping beta publish."
          fi
          echo "active=false" >> "$GITHUB_OUTPUT"

  version-or-publish:
    needs: check-prerelease-mode
    if: needs.check-prerelease-mode.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
          token: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ^11.28.6
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:client

      - name: Typecheck
        run: pnpm typecheck:client

      - name: Run audit
        run: pnpm audit --audit-level high

      - name: Build components scenes-client
        run: pnpm build:client

      - name: Run unit tests
        run: pnpm test:client:unit

      - name: Create beta release PR or publish to npm
        id: changesets
        uses: changesets/action@v1.2.1
        with:
          publish: pnpm changeset publish --tag beta
          title: Release beta packages
          commit: Release beta packages
        env:
          GITHUB_TOKEN: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
          GIT_AUTHOR_NAME: imodeljs-admin
          GIT_AUTHOR_EMAIL: imodeljs-admin@users.noreply.github.com
          GIT_COMMITTER_NAME: imodeljs-admin
          GIT_COMMITTER_EMAIL: imodeljs-admin@users.noreply.github.com

      - name: Log Changesets Outputs
        run: |
          echo "Published: ${{ steps.changesets.outputs.published }}"
          echo "Published Packages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "Has Changesets: ${{ steps.changesets.outputs.hasChangesets }}"
          echo "Pull Request Number: ${{ steps.changesets.outputs.pullRequestNumber }}"
