# This workflow is triggered manually to publish beta versions of the package, using
# Changesets' prerelease mode (`changeset pre enter/version/publish`). It must be run from
# a non-main branch that has at least one pending changeset. Each run:
#   1. Enters beta prerelease mode if not already in it (writes .changeset/pre.json)
#   2. Applies pending changesets, bumping to the next '-beta.N' version
#   3. Publishes the package to npm under the 'beta' dist-tag
#   4. Commits and pushes the resulting version/changelog bump back to the triggering branch,
#      so the next run can correctly compute 'beta.N+1'
# Before merging the branch to main, exit prerelease mode (`pnpm changeset pre exit`), commit,
# and ensure the pending changesets are still present so the real release workflow can use them.
name: Publish Beta Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    environment: npm-beta-publish # requires approval from code owners
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse to run from main
        if: github.ref_name == 'main'
        run: |
          echo "::error::This workflow must be run from a feature branch, not 'main'."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so changesets can diff against the base branch
          token: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ^11.28.6
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:client

      - name: Typecheck
        run: pnpm typecheck:client

      - name: Run audit
        run: pnpm audit --audit-level high

      - name: Run unit tests
        run: pnpm test:client:unit

      - name: Verify a changeset is pending
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No pending changesets found on this branch. Add one with 'pnpm changeset' before publishing a beta."
            exit 1
          fi

      - name: Enter beta prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            TAG=$(node -p "require('./.changeset/pre.json').tag")
            if [ "$TAG" != "beta" ]; then
              echo "::error::.changeset/pre.json already exists with tag '$TAG', expected 'beta'. Resolve prerelease mode manually before running this workflow."
              exit 1
            fi
            echo "Already in beta prerelease mode; continuing."
          else
            pnpm changeset pre enter beta
          fi

      - name: Apply changesets and bump beta version
        run: pnpm changeset version

      - name: Build components scenes-client
        run: pnpm build:client

      - name: Publish to npm
        run: pnpm changeset publish --tag beta --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}

      - name: Commit and push version bump
        run: |
          git config user.name "imodeljs-admin"
          git config user.email "imodeljs-admin@users.noreply.github.com"
          git add -A
          git commit -m "Publish beta version [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
